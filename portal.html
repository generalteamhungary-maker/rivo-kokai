:root{--paper:#F6F6F2;--sheet:#FFFFFF;--ink:#262A27;--muted:#5E6660;--line:#DCE0D8;--sage:#3F7A4C;--sage-tint:#E6F1E1;--oak:#8A6A47;--warn:#9A5B00;--warn-tint:#FDF1DF;

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:22px 60px;display:flex;flex-direction:column;gap:22px}

h1{font-size:clamp(28px,5vw,40px)}h2{font-size:22px;font-weight:400}h3{font-size:18px;font-weight:400}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:14px}
.logo{display:flex;gap:10px;align-items:center}
.logo img{width:38px;height:38px;mix-blend-mode:multiply}
.logo b{font-family:var(--display);font-weight:400;letter-spacing:.16em;font-size:18px;display:block}
.logo small,.tag{font-family:var(--display);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--sheet);border:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:12px}
.card.hl{border-color:var(--oak);box-shadow:inset 4px 0 0 var(--oak)}
.muted{color:var(--muted)}
.ph{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.ph:first-child{border-top:0}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--muted)}
.dot.done{background:var(--sage);color:#fff}.dot.active{background:var(--ink);color:#fff}.dot.wait{background:var(--oak);color:#fff}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--muted)}
.pill.done{background:var(--sage-tint);color:var(--sage)}.pill.wait{background:var(--warn-tint);color:var(--warn)}.pill.active{background:#E7ECF3;color:#284B73}
ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:14.5px}
.docs a{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:8px 10px;color:var(--ink);text-decoration:none;font-size:14.5px;overflow-wrap:anywhere}
.docs a:hover{border-color:var(--sage)}
.docs{display:flex;flex-direction:column;gap:6px}
.ext{font-family:var(--display);font-size:11px;letter-spacing:.08em;background:var(--paper);padding:1px 6px}
.btn{font:inherit;font-weight:600;border:1.5px solid var(--ink);background:var(--ink);color:#fff;padding:11px 18px;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:10px;flex-wrap:wrap}
textarea{font:inherit;width:100%;min-height:84px;border:1px solid var(--line);padding:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td{padding:9px 0;border-bottom:1px solid var(--line)}td.r{text-align:right;font-variant-numeric:tabular-nums}
.log div{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;font-size:14px;padding-block:4px}
.msg{padding:12px 14px;background:var(--sage-tint);color:var(--sage);font-weight:600}
.err{padding:12px 14px;background:#FBE9E7;color:#9C2A20}

<script>
(function(){
