h3{margin-top:4px}

  h+='<div class="card"><div class="ghead"><h2>Ütemterv</h2>'+(sch[last]?'<span class="muted">Várható befejezés: <b style="color:var(--ink)">'+fd(sch[last][1])+'</b></span>':'')+'</div>'+gantt(p,T);
  var hist=(p.hist||[]).slice().reverse();
  if(hist.length)h+='<div class="chgs"><b>Ütemezés-változások</b>'+hist.slice(0,6).map(function(c){return '<div><span class="muted">'+fs(c.d)+'</span><span>'+esc((T[c.ph]||{t:''}).t)+': '+fs(c.from)+' → <b>'+fs(c.to)+'</b> · '+esc(c.ok)+(c.m?'<br><span class="muted">'+esc(c.m)+'</span>':'')+'</span></div>'}).join('')+'</div>';
  h+='<p class="muted" style="font-size:13px">A *-gal jelölt határidő módosult. Ha a tartalom vagy a határidő változik, e-mailben is értesítést kapsz.</p></div>';
  /* hol tartunk */
  h+='<div class="card"><h2>Hol tartunk?</h2><div>';
  p.phases.forEach(function(x,i){if(x.st==='skip')return;var t=T[i]||{t:'Fázis '+(i+1),del:[]},xd=ex.filter(function(e){return e.ph===i&&e.st==='ok'}).map(function(e){return e.t+' (többlettartalom)'});
    h+='<div class="ph"><span class="dot '+x.st+'">'+(x.st==='done'?'✓':i+1)+'</span><div><b style="font-weight:600">'+esc(t.t)+'</b>'+(sch[i]?'<div class="muted" style="font-size:13.5px">'+(x.st==='done'?'Elkészült':'Határidő: '+fd(sch[i][1]))+'</div>':'')+(x.st==='active'||x.st==='wait'?'<ul>'+t.del.concat(xd).map(function(d){return '<li>'+esc(d)+'</li>'}).join('')+'</ul>':(xd.length?'<ul>'+xd.map(function(d){return '<li>'+esc(d)+'</li>'}).join('')+'</ul>':''))+'</div><span class="pill '+x.st+'">'+(STL[x.st]||'')+'</span></div>'});
  h+='</div></div>';
  /* dokumentumok + tárhely */
  var docs=[];p.phases.forEach(function(x,i){(x.docs||[]).forEach(function(d){if(d[2])docs.push([T[i]?T[i].t:'',d])})});
  h+='<div class="card"><h2>Dokumentumok</h2>'+(docs.length?'<div class="docs">'+docs.map(function(z){return docLink(z[1],z[0])}).join('')+'</div>':'<p class="muted">Itt jelennek meg a tervek, amint feltöltöm őket.</p>');
  var links=[];if(p.mappa)links.push({n:'Közös Google Drive mappa',u:p.mappa});(p.tar||[]).forEach(function(x){links.push(x)});
  if(links.length)h+='<h3>Közös tárhely</h3><div class="docs">'+links.map(function(x){return '<a href="'+esc(x.u)+'" target="_blank" rel="noopener"><span class="ext">LINK</span>'+esc(x.n)+'</a>'}).join('')+'</div>';
  var uf=p.ufiles||[];
  h+='<h3>Fájl küldése Zsófinak</h3><p class="muted" style="font-size:14px">Alaprajz, fotó, minta, ötlet: bármit feltölthetsz, ami a tervezéshez kell (max. 20 MB fájlonként).</p>'+(uf.length?'<div class="docs">'+uf.map(function(d){return docLink(d,d[3]?fs(d[3]):'')}).join('')+'</div>':'')+'<label class="btn sec" style="align-self:flex-start;cursor:pointer" id="uplab">Fájl kiválasztása és feltöltése<input type="file" id="pupl" multiple hidden></label></div>';
  /* fizetés */
  var PS={paid:['Fizetve','done'],invoiced:['Díjbekérő kiküldve','wait'],due:['Hamarosan esedékes','active'],future:['A fázis átadása után','']};
  h+='<div class="card"><h2>Fizetési ütemezés</h2><table>';
  (p.pays||[]).forEach(function(y){var s=PS[y.st]||['',''];h+='<tr><td>'+esc(y.t)+'<br><span class="pill '+s[1]+'">'+s[0]+'</span></td><td class="r">'+ft(y.amt)+' + áfa</td></tr>'});
  h+='</table><p class="muted" style="font-size:13.5px">Mindig csak az elkészült és jóváhagyott fázis után fizetsz. Online fizetés hamarosan.</p></div>';
  /* kapcsolatok */
  h+='<div class="card"><h2>Kapcsolatok</h2><div class="contacts"><div><b>Kókai Zsófia</b><span class="muted">belsőépítész, tervező</span>'+(D.settings.telefon?'<a href="tel:'+esc(String(D.settings.telefon).replace(/\s/g,''))+'">'+esc(D.settings.telefon)+'</a>':'')+(D.settings.email?'<a href="mailto:'+esc(D.settings.email)+'">'+esc(D.settings.email)+'</a>':'')+(D.settings.meet?'<a href="'+esc(D.settings.meet)+'" target="_blank" rel="noopener">Online konzultáció link</a>':'')+'</div>';
  (p.kont||[]).forEach(function(c){h+='<div><b>'+esc(c.nev)+'</b><span class="muted">'+esc(c.szerep||'')+'</span>'+(c.tel?'<a href="tel:'+esc(String(c.tel).replace(/\s/g,''))+'">'+esc(c.tel)+'</a>':'')+(c.email?'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'')+'</div>'});
  h+='</div></div>';
  h+='<div class="card"><h2>Történet</h2><div class="log">'+(p.log||[]).slice().reverse().slice(0,10).map(function(l){return '<div><span class="muted">'+fd(l[0])+'</span><span>'+esc(l[1])+'</span></div>'}).join('')+'</div></div>';
  app.innerHTML=h;
}
function lock(on){[].forEach.call(app.querySelectorAll('button'),function(x){x.disabled=on})}
function fail(err){app.insertAdjacentHTML('afterbegin','<div class="err" role="alert">'+esc(err&&err.message||err)+'</div>');lock(false);window.scrollTo(0,0)}
app.addEventListener('click',function(e){
  var ib=e.target.closest('[data-ics]');if(ib){var ev=(D.events||[]).filter(function(x){return x.id===ib.dataset.ics})[0];if(ev)icsDl(ev);return}
  var xb=e.target.closest('[data-x]');if(xb){var id=xb.dataset.id,dx=xb.dataset.x,mx=((document.getElementById('xm_'+id)||{}).value||'').trim();lock(true);
    google.script.run.withSuccessHandler(function(res){D=res;flash=dx==='ok'?'Köszönöm, a jóváhagyásodat rögzítettem. Zsófi értesítést kapott.':'Rendben, jeleztem Zsófinak, hogy ezt a tételt nem kéred.';render();window.scrollTo(0,0)}).withFailureHandler(fail).portalExtra(CFG.pid,CFG.t,id,dx,mx);return}
  var b=e.target.closest('[data-d]');if(!b)return;var i=+b.dataset.i,dd=b.dataset.d,m=(document.getElementById('m'+i)||{}).value||'';
  if(dd==='mod'&&!m.trim()){var ta=document.getElementById('m'+i);ta.focus();ta.style.borderColor='#9C2A20';return}
  lock(true);
  google.script.run.withSuccessHandler(function(res){D=res;flash=dd==='ok'?'Köszönöm, a jóváhagyásodat rögzítettem. Zsófi értesítést kapott.':'Köszönöm, a módosítási kérésedet továbbítottam Zsófinak.';render();window.scrollTo(0,0)})
    .withFailureHandler(fail).portalDontes(CFG.pid,CFG.t,i,dd,m.trim())});
app.addEventListener('change',function(e){var t=e.target;if(t.id!=='pupl')return;var files=[].slice.call(t.files||[]);if(!files.length)return;var left=files.length,lab=document.getElementById('uplab');
  files.forEach(function(f){if(f.size>20*1024*1024){fail('Túl nagy fájl (max. 20 MB): '+f.name);left--;return}
    if(lab)lab.firstChild.textContent='Feltöltés folyamatban…';var fr=new FileReader();fr.onload=function(){var b64=String(fr.result).split(',')[1];
      google.script.run.withSuccessHandler(function(res){left--;if(res&&res.p)D.p=res.p;if(left<=0){flash='Köszönöm, a fájlt megkaptam. Zsófi értesítést kapott.';render()}}).withFailureHandler(function(err){left--;fail(err)}).portalFeltolt(CFG.pid,CFG.t,f.name,f.type,b64)};fr.readAsDataURL(f)})});
google.script.run.withSuccessHandler(function(res){D=res;render()}).withFailureHandler(function(err){app.innerHTML='<div class="err">'+esc(err&&err.message||err)+'</div>'}).portalBetolt(CFG.pid,CFG.t);
})();
</script>
