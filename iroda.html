<style>
/* Layout: bal oldali menü + munkaterület; a projekt nézet egy idővonal (fázisok) + részletpanel */
:root{
  --bg:#F5F6F2; --surface:#FFFFFF; --fg:#0F1D26; --muted:#56656D; --line:#DCE2E4; --soft:#EEF1EF;
  --brand:#1A56A0; --brand-tint:#E8EFF7; --on-brand:#FFFFFF; --brass:#F0A23B; --brass-tint:#FDF1DF;
  --ok:#1F7A4D; --ok-tint:#E3F2EA; --warn:#9A5B00; --warn-tint:#FDF1DF; --bad:#B3261E; --bad-tint:#FBE9E7;
  --display:'Bricolage Grotesque',Georgia,serif; --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
html,:root[data-theme]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;gap:10px;align-items:center}
.brand b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.brand small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;border:0;border-radius:7px;padding:9px 10px;cursor:pointer;color:var(--muted);font-weight:500}
.menu button:hover{background:var(--soft);color:var(--fg)}
.menu button[aria-current="page"]{background:var(--brand-tint);color:var(--brand);font-weight:600}
.menu .cnt{font-size:11.5px;background:var(--brass);color:#2B1B00;border-radius:99px;padding:0 7px;font-weight:700}
.side .foot{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.pro{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;background:var(--brand);color:var(--on-brand);border-radius:4px;padding:1px 6px;vertical-align:1px}
.main{padding:22px 26px 60px;min-width:0;display:flex;flex-direction:column;gap:20px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.demo{font-size:12.5px;background:var(--brass-tint);color:var(--warn);border-radius:6px;padding:6px 10px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:7px;padding:8px 14px;border:1.5px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
.btn.sec{background:transparent;color:var(--brand)}
.btn.ghost{border-color:var(--line);background:var(--surface);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi b{font-family:var(--display);font-size:26px;display:block}
.kpi span{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-tint);color:var(--ok)}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-bad{background:var(--bad-tint);color:var(--bad)}
.p-info{background:var(--brand-tint);color:var(--brand)}
.p-mute{background:var(--soft);color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
/* projekt */
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:500}
.ptabs button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-tint);color:var(--brand);font-weight:600}
.head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.gantt{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
.gl{display:grid;grid-template-columns:200px minmax(420px,1fr);gap:10px;align-items:center;font-size:13px}
.gl .lab{display:flex;gap:6px;align-items:center;min-width:0}
.gl .lab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:22px;background:var(--soft);border-radius:4px}
.seg{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--line)}
.seg.done{background:var(--ok)}
.seg.active{background:var(--brand)}
.seg.wait{background:var(--brass)}
.brk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 28%,transparent) 4px 6px)}
.today{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.axis{display:grid;grid-template-columns:200px minmax(420px,1fr);gap:10px;font-size:11px;color:var(--muted)}
.axis .ticks{position:relative;height:16px}
.axis .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.phases{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.plist{display:flex;flex-direction:column;gap:6px}
.plist button{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;cursor:pointer;align-items:start}
.plist button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--soft);color:var(--muted)}
.dot.done{background:var(--ok);color:#fff}.dot.active{background:var(--brand);color:var(--on-brand)}.dot.wait{background:var(--brass);color:#2B1B00}
.plist .pt{font-weight:600;font-size:14px}
.plist .ps{font-size:12px;color:var(--muted)}
.plist button.skip{border-style:dashed;background:transparent}
.plist button.skip .pt{color:var(--muted);font-weight:500}
.plist .sep{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 2px 2px}
.req-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;background:var(--soft);color:var(--muted);border-radius:4px;padding:1px 6px;margin-left:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0}
.chk input{margin-top:3px;accent-color:var(--ok);width:16px;height:16px}
.chk.on span{color:var(--muted);text-decoration:line-through}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.counter{display:flex;align-items:center;gap:8px;font-size:13.5px}
.counter .bx{display:flex;gap:3px}
.counter .bx i{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--brand)}
.counter .bx i.on{background:var(--brand)}
.counter .bx i.x{border-color:var(--bad);background:var(--bad)}
.log{display:flex;flex-direction:column;gap:6px;font-size:13px}
.log div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px}
.docs{display:flex;flex-direction:column;gap:6px}
.doc{display:flex;gap:10px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:7px;padding:7px 10px}
.doc .ext{font-family:var(--mono);font-size:11px;background:var(--soft);border-radius:4px;padding:1px 5px}
/* megkeresések */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:13px;display:flex;justify-content:space-between;color:var(--muted);font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.lead b{font-size:14.5px}
/* ajánlat */
.offer{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{font-weight:400;font-size:14px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;width:100%}
.mod{display:grid;grid-template-columns:22px minmax(0,1fr) 120px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mod input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.mod small{display:block;color:var(--muted);font-size:12px}
.paper{background:#FFFFFF;color:#1F2328;border:1px solid var(--line);border-radius:4px;padding:28px 30px;display:flex;flex-direction:column;gap:14px;font-size:13px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.paper h2{font-family:var(--body);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#1F2328}
.paper .hdr{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:#5A6168;border-bottom:1px solid #1F2328;padding-bottom:10px}
.paper table{font-size:12.5px;color:#1F2328}
.paper td,.paper th{border-color:#E1E4E6;color:#1F2328}
.paper .tot td{font-weight:700;border-top:1.5px solid #1F2328}
.paper ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.paper .small{font-size:11.5px;color:#5A6168}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:30}
.mtop{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.offer{grid-template-columns:minmax(0,1fr)}.phases{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px;gap:10px}
  .menu{flex-direction:row;overflow-x:auto;gap:4px}
  .menu button{white-space:nowrap}
  .side .foot{display:none}
  .main{padding:16px 16px 60px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.paper{padding:18px}}
</style>

function mkProject(o){
  var p={token:rnd(),email:o.email||'',tel:o.tel||'',id:o.id,nev:o.nev,ugyfel:o.ugyfel,hely:o.hely,m2:o.m2,csomag:o.csomag||'Teljes körű tervezés',start:o.start,rev:o.rev||{},konz:o.konz||0,log:o.log||[],phases:[],pays:[]};
  var mods=o.mods||TPL.map(function(t){return t.k});p.mods=mods;
  TPL.forEach(function(t,i){var inc=t.req||mods.indexOf(t.k)>=0;p.phases.push({k:t.k,st:!inc?'skip':(i<o.at?'done':(i===o.at?(o.wait?'wait':'active'):'todo')),chk:t.del.map(function(_,j){return i<o.at||(i===o.at&&j<(o.chk||0))}),docs:[]})});
  var pp=[];TPL.forEach(function(t,i){if(p.phases[i].st!=='skip'&&t.pay)pp.push([i,t.pay])});
  var last=-1;p.phases.forEach(function(x,i){if(x.st!=='skip')last=i});if(!TPL[last].pay)pp.push([last,TPL[last].t+' átadása után']);
  var w=pp.map(function(_,i){return i===0?1.25:1}),ws=w.reduce(function(a,b){return a+b},0);
  pp.forEach(function(x,idx){p.pays.push({ph:x[0],t:x[1],amt:Math.round(o.total*w[idx]/ws/1000)*1000,st:o.paid>idx?'paid':'future'})});
  return p;
}

function save(){if(!S)return;prep();var j=JSON.stringify(S);if(j===LAST&&!OUT.length)return;var r=gs();
  if(!r){try{localStorage.setItem(KEY,j)}catch(e){}LAST=j;OUT=[];return}
  if(SAVING){DIRTY=true;return}SAVING=true;var lv=OUT;OUT=[];
  r.withSuccessHandler(function(res){SAVING=false;if(res&&res.ok){SV=res.v;S.v=res.v;LAST=JSON.stringify(S);if(lv.length)toast(lv.length===1?'E-mail elküldve: '+lv[0].to:lv.length+' e-mail elküldve')}else if(res&&res.state){S=res.state;SV=S.v;LAST=JSON.stringify(S);toast('Közben új esemény érkezett, frissítettem a nézetet');render()}if(DIRTY){DIRTY=false;save()}})
   .withFailureHandler(function(err){SAVING=false;OUT=lv.concat(OUT);toast('Mentés sikertelen: '+(err&&err.message||err))}).irodaMent(CFG.k,j,SV,lv)}
function poll(){var r=gs();if(!r||SAVING||!S)return;if(JSON.stringify((prep(),S))!==LAST)return;
  r.withSuccessHandler(function(res){if(res&&res.state&&res.state.v>SV&&!SAVING){S=res.state;SV=S.v;LAST=JSON.stringify(S);render();toast('Új esemény érkezett')}}).irodaBetolt(CFG.k)}
function boot(){var r=gs();
  if(!r){try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}if(!S||!S.projects)S=seed();prep();render();return}
  document.getElementById('main').innerHTML='<p class="muted">Betöltés…</p>';
  r.withSuccessHandler(function(res){if(res.state){S=res.state;SV=S.v||0;prep();LAST=JSON.stringify(S)}else{S=seed();(res.pending||[]).forEach(function(l){S.leads.unshift(l)});SV=0}render();setInterval(poll,30000)})

      var s1=mail(l.email,'Időpont-visszaigazolás: helyszíni felmérés '+fdl(dd)+' '+tv,'<p>Kedves '+esc(firstName(l.nev))+'!</p><p>Visszaigazolom a díjmentes helyszíni felmérés időpontját: <b>'+fdl(dd)+' '+tv+'</b>'+(l.hely?', '+esc(l.hely):'')+'.</p><p>Ha van építészeti alaprajz (PDF vagy DWG), kérlek, küldd el előtte, vagy hozd magaddal. Ha közbejön valami, csak válaszolj erre a levélre.</p>'+sign());
      toast(s1?'Időpont visszaigazolva e-mailben':'Időpont rögzítve. Az érdeklődőnek nincs e-mail címe')}
    else{l.st=a3[1];l.note='Ajánlat elfogadva, szerződés előkészítve';toast('Szerződés előkészítve')}render()}
  else if(d.offer){var l2=S.leads.filter(function(x){return x.id===d.offer})[0];OF.ugyfel=l2.nev;OF.targy=l2.ingatlan;OF.hely=l2.hely;OF.m2=l2.m2;OF.lead=l2.id;view.tab='ajan';render()}
  else if(d.mkproj){var l3=S.leads.filter(function(x){return x.id===d.mkproj})[0];var np=mkProject({email:l3.email,tel:l3.tel,id:'p'+Date.now(),nev:(l3.ingatlan||'Projekt')+(l3.hely?', '+l3.hely:''),ugyfel:l3.nev,hely:l3.hely,m2:l3.m2||0,mods:l3.mods,start:iso(addD(TODAY,3)),at:0,paid:0,total:ofCalc().sum||l3.m2*15000});np.pays[0].st='due';log(np,'Projekt létrehozva a megkeresésből');S.projects.push(np);mail(np.email,'Elindult a tervezés: '+np.nev,'<p>Kedves '+esc(firstName(np.ugyfel))+'!</p><p>Köszönöm a bizalmat, elindult a közös munka. Az ügyfélportálon mindig látod, hol tartunk, ott tudod jóváhagyni a terveket, és ott találod a dokumentumokat is.</p>'+btnHtml(portalUrl(np),'Ügyfélportál megnyitása')+sign());S.leads=S.leads.filter(function(x){return x!==l3});view.tab='proj';view.pid=np.id;view.ph=0;toast('Projekt elindítva, az előlegszámla kiállítható');render()}
  else if(d.act==='leadas'){var ph=p.phases[view.ph];ph.st='wait';log(p,TPL[view.ph].t+': leadva az ügyfélnek');var s2=mail(p.email,'Jóváhagyásra vár: '+TPL[view.ph].t+' – '+p.nev,'<p>Kedves '+esc(firstName(p.ugyfel))+'!</p><p>Elkészült a(z) <b>'+esc(TPL[view.ph].t.toLowerCase())+'</b> fázis. A terveket az ügyfélportálon nézheted meg, és ott tudod jóváhagyni, vagy jelezni, ha módosítást kérsz.</p>'+btnHtml(portalUrl(p),'Tervek megtekintése')+sign());toast(s2?'Leadva: az ügyfél e-mailt kapott a jóváhagyáshoz':'Leadva. Add meg fent az ügyfél e-mail címét, hogy értesítést kapjon');render()}
  else if(d.act==='jovahagy'){var i=view.ph;p.phases[i].st='done';var y=p.pays.filter(function(q){return q.ph===i})[0];if(y&&y.st==='future')y.st='due';var nx=i+1;while(nx<p.phases.length&&p.phases[nx].st==='skip')nx++;if(nx<p.phases.length&&p.phases[nx].st==='todo')p.phases[nx].st='active';log(p,TPL[i].t+': ügyfél jóváhagyta');view.ph=nx<p.phases.length?nx:i;toast(y?'Jóváhagyva – a mérföldkő számlázható':'Jóváhagyva, indul a következő fázis');render()}
  else if(d.act==='modositas'){var k=TPL[view.ph].k;p.rev[k]=(p.rev[k]||0)+1;p.phases[view.ph].st='active';log(p,TPL[view.ph].t+': módosítási kör '+p.rev[k]+'.');toast(p.rev[k]>2?'Ez már díjköteles módosítási kör':'Módosítási kör rögzítve');render()}
  else if(d.act==='addmod'){p.phases[view.ph].st='todo';p.mods.push(TPL[view.ph].k);var amt=Math.round(p.m2*3000/1000)*1000;p.pays.push({ph:view.ph,t:TPL[view.ph].t+' átadása után',amt:amt,st:'future'});p.pays.sort(function(a,b){return a.ph-b.ph});log(p,'Modul hozzáadva: '+TPL[view.ph].t);var s3=mail(p.email,'Ajánlatkiegészítés: '+TPL[view.ph].t,'<p>Kedves '+esc(firstName(p.ugyfel))+'!</p><p>Ahogy egyeztettük, a projektbe bekerül a(z) <b>'+esc(TPL[view.ph].t)+'</b> modul, '+ft(amt)+' + áfa összegben. Az ütemezést frissítettem az ügyfélportálon.</p>'+btnHtml(portalUrl(p),'Ügyfélportál')+sign());toast(s3?'Ajánlatkiegészítés elküldve az ügyfélnek':'Modul hozzáadva');render()}
  else if(d.act==='konz'){p.konz++;log(p,'Konzultáció rögzítve ('+p.konz+'.)');toast(p.konz>3?'A csomagban foglalt konzultációk elfogytak':'Konzultáció rögzítve');render()}
  else if(d.act==='sendoffer'){var c=ofCalc();if(OF.lead){var l4=S.leads.filter(function(x){return x.id===OF.lead})[0];if(l4){l4.st='ajanlat';l4.mods=MODS.filter(function(m){return OF.mods[m[0]]}).map(function(m){return m[0]});l4.note='Ajánlat kiküldve '+fd(TODAY)+': '+ft(c.sum)+' + áfa'}}var lm=l4&&l4.email;var rows=MODS.filter(function(m){return OF.mods[m[0]]}).map(function(m){return '<tr><td style="padding:6px 10px 6px 0;border-bottom:1px solid #e5e5e5">'+m[1]+'</td><td style="padding:6px 0;border-bottom:1px solid #e5e5e5;text-align:right">'+ft(c.r[m[0]])+'</td></tr>'}).join('');var s4=mail(lm,'Belsőépítészeti tervezési ajánlat – '+OF.targy,'<p>Kedves '+esc(firstName(OF.ugyfel))+'!</p><p>Köszönöm a találkozót. A megbeszéltek alapján az ajánlatom:</p><table style="border-collapse:collapse;width:100%;font-size:14px">'+rows+'<tr><td style="padding:8px 0;font-weight:bold">Összesen</td><td style="padding:8px 0;text-align:right;font-weight:bold">'+ft(c.sum)+' + áfa</td></tr></table><p>A tervezés fázisonként fizetendő, mindig az adott fázis átadása után. Az ajánlat érvényes: '+fdl(pd(OF.erv))+'. Ha elfogadod, csak válaszolj erre a levélre.</p>'+sign());toast(s4?'Ajánlat elküldve e-mailben: '+ft(c.sum)+' + áfa':'Ajánlat rögzítve (az érdeklődőnek nincs e-mail címe)');view.tab='megk';render()}
  else if(d.act==='newlead'){var g=function(i){return (document.getElementById(i)||{}).value||''};if(!g('nl_nev').trim()){toast('Add meg a nevet');return}var hm=g('nl_hely'),mm=(hm.match(/(\d+)\s*m/)||[])[1];
    S.leads.unshift({id:'l'+Date.now(),nev:g('nl_nev').trim(),email:g('nl_email').trim(),tel:g('nl_tel').trim(),tipus:g('nl_tipus'),ingatlan:g('nl_ing'),m2:+mm||0,hely:hm.replace(/\d+\s*m²?,?\s*/,'').trim(),st:'uj',when:iso(TODAY),note:''});toast('Megkeresés rögzítve');render()}
  else if(d.act==='cleardemo'){S.projects=S.projects.filter(function(x){return !/\(minta\)/.test(x.ugyfel)});S.leads=S.leads.filter(function(x){return !/\(minta\)/.test(x.nev)});S.events=S.events.filter(function(x){return !/Kiss Péter|Németh család|Horváth Anna|Tóth Eszter/.test(x.c)});view.pid=(S.projects[0]||{}).id;toast('Mintaadatok törölve');view.tab='att';render()}
  else if(d.act==='resetoffer'){OF.rate={felm:2500,stil:3000,oss:2000,lat:3500,atn:3000,resz:3500,ber:1500};render()}
});
main.addEventListener('change',function(e){var t=e.target,p=S.projects.filter(function(x){return x.id===view.pid})[0];
  if(t.dataset.set){S.settings[t.dataset.set]=t.value.trim();toast('Mentve');save();return}
  if(t.dataset.pe){p.email=t.value.trim();toast('Ügyfél e-mail mentve');save();return}
  if(t.dataset.chk!=null){p.phases[view.ph].chk[+t.dataset.chk]=t.checked;if(p.phases[view.ph].st==='todo')p.phases[view.ph].st='active';render()}
  else if(t.dataset.mod){OF.mods[t.dataset.mod]=t.checked?1:0;render()}
  else if(t.id==='upl'){var r=gs(),phi=view.ph,files=[].slice.call(t.files);
    files.forEach(function(f){var m=f.name.match(/^(.*)\.([^.]+)$/),nm=m?m[1]:f.name,ex=m?m[2].toLowerCase():'';
      if(!r){p.phases[phi].docs.push([nm,ex]);render();return}
      if(f.size>20*1024*1024){toast('Túl nagy fájl (max. 20 MB): '+f.name);return}
      toast('Feltöltés: '+f.name+'…');var fr=new FileReader();fr.onload=function(){var b64=String(fr.result).split(',')[1];
        r.withSuccessHandler(function(res){p.phases[phi].docs.push([nm,ex,res.url]);log(p,'Feltöltve: '+f.name);toast('Feltöltve, az ügyfél látja a portálon');render()}).withFailureHandler(function(err){toast('Feltöltés sikertelen: '+(err&&err.message||err))}).irodaFeltolt(CFG.k,p.id,f.name,f.type,b64)};fr.readAsDataURL(f)});
    if(!r){log(p,files.length+' terv feltöltve');toast('Feltöltve');render()}}
});
main.addEventListener('input',function(e){var t=e.target;
  if(t.dataset.of){OF[t.dataset.of]=t.type==='number'?(+t.value||0):t.value;softRender(t)}
  else if(t.dataset.rate){OF.rate[t.dataset.rate]=+t.value||0;softRender(t)}});
function softRender(t){var id=t.dataset.of||t.dataset.rate,attr=t.dataset.of?'data-of':'data-rate',pos=t.selectionStart;render();var n=main.querySelector('['+attr+'="'+id+'"]');if(n){n.focus();try{if(pos!=null&&n.type==='text')n.setSelectionRange(pos,pos)}catch(_){}}}
boot();
})();
